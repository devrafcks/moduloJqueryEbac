<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens</title>
    <link rel="preconnect" href="http://fonts.googleapis.com">
    <link rel="preconnect" href="http://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./main.css">

</head>

<body>
    <header>
        <h1>Galeria de Fotos</h1>
        <button type="button">Nova imagem +</button>
    </header>
    <main>

        <form>
            <h2>Inserir nova imagem</h2>
            <input type="url" required placeholder="URL da imagem">
            <button type="submit">Adicionar</button>
            <button type="reset" class="cancelar">Cancelar</button>
        </form>

        <ul>
            <li>
                <img src="./images/foto1.jpg">
            </li>
            <li>
                <img src="./images/foto2.jpg">
            </li>
            <li>
                <img src="./images/foto3.jpg">
            </li>
            <li>
                <img src="./images/foto4.jpg">
            </li>
            <li>
                <img src="./images/foto5.jpg">
            </li>
        </ul>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./script.js"></script>
</body>

</html>
